<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeystoneUB Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #071022; /* Deep navy */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box {
            background: #0d162e;
            padding: 40px;
            width: 350px;
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(0,0,0,0.45);
            border: 1px solid #d4af37; /* Gold */
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #d4af37;
            font-size: 22px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
            background: #0b1326;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #b8922c;
        }

        .error {
            color: #ff4d4d;
            margin-top: 12px;
            text-align: center;
            display: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Keystone Ultimate Bank</h2>

        <input type="text" id="username" placeholder="Enter Username">
        <input type="password" id="password" placeholder="Enter Password">

        <button onclick="login()">Sign In</button>

        <div class="error" id="errorMsg">Invalid username or password</div>
    </div>

    <script>
        function login() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();

            const correctUser = "MadonnaB";
            const correctPass = "MadonnaB1$";

            if (user === correctUser && pass === correctPass) {
                window.location.href = "Dashboard.html";
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        }
    </script>

</body>
</html>
