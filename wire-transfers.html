<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeystoneUB Wire Transfers</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #071022;
            color: white;
        }

        .navbar {
            background: #0d162e;
            padding: 18px 30px;
            border-bottom: 1px solid #d4af37;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container {
            padding: 30px;
        }

        .title {
            font-size: 26px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 25px;
        }

        .section {
            background: #0d162e;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #d4af37;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        .section h3 {
            margin: 0 0 15px 0;
            color: #d4af37;
            font-size: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #d4af37;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #0b1326;
            color: white;
            font-size: 15px;
        }

        .btn {
            padding: 14px 20px;
            background: #d4af37;
            color: black;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #b8922c;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #0d162e;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #d4af37;
            width: 350px;
            text-align: center;
        }

        .modal-content h3 {
            color: #d4af37;
            margin-bottom: 15px;
        }

        .close-btn {
            background: #ff4d4d;
            color: white;
        }

        .close-btn:hover {
            background: #cc3c3c;
        }
    </style>
</head>

<body>

    <div class="navbar">Keystone Ultimate Bank</div>

    <div class="container">

        <div class="title">Wire Transfers</div>

        <!-- Recipient Section -->
        <div class="section">
            <h3>Recipient Information</h3>

            <div class="input-group">
                <label>Select Saved Recipient</label>
                <select>
                    <option>— Select Recipient —</option>
                    <option>Gregory Carter</option>
                    <option>UN Authority</option>
                </select>
            </div>

            <div class="input-group">
                <label>Recipient Full Name</label>
                <input type="text" placeholder="Enter full name">
            </div>

            <div class="input-group">
                <label>Recipient Address</label>
                <input type="text" placeholder="Enter address">
            </div>
        </div>

        <!-- Bank Details -->
        <div class="section">
            <h3>Bank Details</h3>

            <div class="input-group">
                <label>Routing Number</label>
                <input type="text" placeholder="Enter routing number">
            </div>

            <div class="input-group">
                <label>Account Number</label>
                <input type="text" placeholder="Enter account number">
            </div>

            <div class="input-group">
                <label>Bank Name</label>
                <input type="text" placeholder="Enter bank name">
            </div>
        </div>

        <!-- Transfer Details -->
        <div class="section">
            <h3>Transfer Details</h3>

            <div class="input-group">
                <label>Amount</label>
                <input type="number" placeholder="Enter amount">
            </div>

            <div class="input-group">
                <label>Wire Purpose</label>
                <input type="text" placeholder="Enter purpose">
            </div>

            <div class="input-group">
                <label>Delivery Speed</label>
                <select>
                    <option>Standard (1–2 business days)</option>
                    <option>Express (Same day)</option>
                </select>
            </div>

            <button class="btn" onclick="openModal()">Review & Submit</button>
        </div>

    </div>

    <!-- Confirmation Modal -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3>Confirm Wire Transfer</h3>
            <p>Please review your details before submitting.</p>
            <button class="btn" onclick="submitWire()">Submit Wire</button>
            <button class="btn close-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById("confirmModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("confirmModal").style.display = "none";
        }

        function submitWire() {
            alert("Wire Transfer Submitted Successfully");
            closeModal();
        }
    </script>

</body>
</html>
