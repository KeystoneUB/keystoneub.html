<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password – KeystoneUB</title>
<style>
body {
    background: #0a0f14;
    font-family: Arial, sans-serif;
    color: white;
}
.box {
    width: 90%;
    max-width: 400px;
    margin: 80px auto;
    padding: 25px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    border: 1px solid rgba(0,255,180,0.2);
}
input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
}
button {
    width: 100%;
    padding: 14px;
    background: #00e6a8;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    color: black;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="box">
    <h2>Reset Password</h2>
    <input type="email" placeholder="Enter your email">
    <button>Send Reset Link</button>
</div>

</body>
</html>
