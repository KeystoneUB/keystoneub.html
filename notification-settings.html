<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KeystoneUB — Notification Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b0d10;
        color: #fff;
    }

    .header {
        padding: 20px;
        background: #111622;
        border-bottom: 1px solid #2a2a2d;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .back-btn {
        background: #0d0f14;
        border: 1px solid #2a2a2d;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        color: #d4af37;
        font-weight: 600;
    }

    .title {
        font-size: 20px;
        font-weight: 700;
        color: #d4af37;
    }

    .section {
        margin: 20px;
        background: #111622;
        border: 1px solid #2a2a2d;
        padding: 20px;
        border-radius: 14px;
    }

    .section h3 {
        margin-top: 0;
        color: #d4af37;
        font-size: 18px;
    }

    .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 12px 0;
    }

    .toggle-row label {
        font-size: 15px;
    }

    .save-btn {
        width: 100%;
        padding: 12px;
        background: #d4af37;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        color: #0b0d10;
        cursor: pointer;
        margin-top: 10px;
    }

    .save-btn:hover {
        background: #b8962f;
    }
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="back-btn" onclick="goBack()">← Back</div>
    <div class="title">Notification Settings</div>
</div>

<!-- NOTIFICATION SECTIONS -->

<div class="section">
    <h3>General Notifications</h3>

    <div class="toggle-row">
        <label>Push Notifications</label>
        <input type="checkbox" checked>
    </div>

    <div class="toggle-row">
        <label>Email Alerts</label>
        <input type="checkbox" checked>
    </div>
</div>

<div class="section">
    <h3>Transaction Alerts</h3>

    <div class="toggle-row">
        <label>Incoming Deposits</label>
        <input type="checkbox" checked>
    </div>

    <div class="toggle-row">
        <label>Outgoing Payments</label>
        <input type="checkbox" checked>
    </div>

    <div class="toggle-row">
        <label>Large Transactions</label>
        <input type="checkbox">
    </div>
</div>

<div class="section">
    <h3>Security Alerts</h3>

    <div class="toggle-row">
        <label>New Device Login</label>
        <input type="checkbox" checked>
    </div>

    <div class="toggle-row">
        <label>Suspicious Activity</label>
        <input type="checkbox" checked>
    </div>
</div>

<div class="section">
    <h3>Marketing Preferences</h3>

    <div class="toggle-row">
        <label>Promotions & Offers</label>
        <input type="checkbox">
    </div>

    <div class="toggle-row">
        <label>Product Updates</label>
        <input type="checkbox">
    </div>
</div>

<button class="save-btn" onclick="saveSettings()">Save Settings</button>

<script>
    function goBack() {
        window.location.href = "dashboard.html";
    }

    function saveSettings() {
        alert("Your notification settings have been updated.");
    }
</script>

</body>
</html>
