signup.html
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KeystoneUB • Sign Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --emerald:#00ff9c;--emerald-glow:0 0 25px #00ff9c,0 0 50px #00ff9c;
  --text-gray:#cfcfcf;--text-soft:#9a9a9a;--glass:rgba(255,255,255,0.06);
  --glass-border:rgba(255,255,255,0.12);
}
body{
  margin:0;background:radial-gradient(circle at top,#02110b 0,#020202 45%,#000 100%);
  font-family:"Inter",sans-serif;color:var(--text-gray);
  display:flex;justify-content:center;align-items:center;height:100vh;
}
.card{
  width:380px;background:var(--glass);border:1px solid var(--glass-border);
  border-radius:18px;padding:28px;backdrop-filter:blur(18px);box-shadow:var(--emerald-glow);
}
.logo-circle{
  width:55px;height:55px;border-radius:50%;border:2px solid var(--emerald);
  display:flex;align-items:center;justify-content:center;color:var(--emerald);
  font-size:24px;font-weight:700;margin:0 auto 14px;box-shadow:var(--emerald-glow);
}
h1{margin:0;font-size:22px;color:var(--emerald);text-align:center;text-shadow:var(--emerald-glow);}
p{margin:6px 0 14px;font-size:13px;color:var(--text-soft);text-align:center;}
input{
  width:100%;padding:11px;margin-top:10px;border-radius:10px;
  border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);
  color:var(--text-gray);font-size:14px;outline:none;
}
input:focus{border-color:var(--emerald);box-shadow:var(--emerald-glow);}
button{
  width:100%;margin-top:16px;padding:11px;border-radius:10px;border:1px solid var(--emerald);
  background:var(--glass);color:var(--emerald);font-size:15px;cursor:pointer;transition:.25s;
}
button:hover{background:var(--emerald);color:#000;box-shadow:var(--emerald-glow);}
.footer{margin-top:14px;font-size:11px;color:var(--text-soft);text-align:center;}
a{color:var(--emerald);text-decoration:none;font-size:11px;}
a:hover{text-decoration:underline;}
</style>
<script>
function signup(){
  window.location.href="dashboard.html";
}
</script>
</head>
<body>
<div class="card">
  <div class="logo-circle">K</div>
  <h1>Create your KeystoneUB account</h1>
  <p>Open your digital banking profile and access your KeystoneUB dashboard.</p>
  <input type="text" placeholder="Full name" value="Madonna F. Bilyeu">
  <input type="email" placeholder="Email address">
  <input type="text" placeholder="Username">
  <input type="password" placeholder="Create password">
  <button onclick="signup()">Create Account</button>
  <div class="footer">
    Already have an account? <a href="index.html">Sign in</a>
  </div>
</div>
</body>
</html>
