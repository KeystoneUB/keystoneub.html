logout.html
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KeystoneUB • Logged Out</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--emerald:#00ff9c;--emerald-glow:0 0 25px #00ff9c,0 0 50px #00ff9c;
--text-gray:#cfcfcf;--text-soft:#9a9a9a;--glass:rgba(255,255,255,0.06);
--glass-border:rgba(255,255,255,0.12);}body{
  margin:0;background:radial-gradient(circle at top,#02110b 0,#020202 45%,#000 100%);
  font-family:"Inter",sans-serif;color:var(--text-gray);
  display:flex;justify-content:center;align-items:center;height:100vh;
}
.card{
  width:360px;background:var(--glass);border:1px solid var(--glass-border);
  border-radius:18px;padding:26px;backdrop-filter:blur(18px);box-shadow:var(--emerald-glow);
  text-align:center;
}
.logo-circle{
  width:50px;height:50px;border-radius:50%;border:2px solid var(--emerald);
  display:flex;align-items:center;justify-content:center;color:var(--emerald);
  font-size:22px;font-weight:700;margin:0 auto 12px;box-shadow:var(--emerald-glow);
}
h1{margin:0;font-size:20px;color:var(--emerald);text-shadow:var(--emerald-glow);}
p{margin:6px 0 14px;font-size:13px;color:var(--text-soft);}
button{
  padding:11px 18px;border-radius:10px;border:1px solid var(--emerald);
  background:var(--glass);color:var(--emerald);font-size:14px;cursor:pointer;transition:.25s;
}
button:hover{background:var(--emerald);color:#000;box-shadow:var(--emerald-glow);}
</style>
<script>
function backToLogin(){window.location.href="index.html";}
</script>
</head>
<body>
<div class="card">
  <div class="logo-circle">K</div>
  <h1>You’ve been logged out</h1>
  <p>Thank you for using KeystoneUB, Madonna F. Bilyeu.</p>
  <button onclick="backToLogin()">Return to login</button>
</div>
</body>
</html>
