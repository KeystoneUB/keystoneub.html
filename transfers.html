<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KeystoneUB — Transfers</title>
<style>
    body { margin:0; background:#0a0f1a; color:#fff; font-family:Arial; }
    header { background:#111622; padding:20px; border-bottom:1px solid #c9a94a; color:#c9a94a; text-align:center; font-size:24px; }
    .container { padding:20px; }
    .card { background:#111622; border:1px solid #c9a94a; padding:20px; border-radius:10px; margin-bottom:20px; }
    .card h2 { color:#c9a94a; margin:0 0 10px; }
    input, select { width:100%; padding:10px; margin:10px 0; background:#0a0f1a; border:1px solid #c9a94a; color:#fff; }
    button { padding:10px 20px; background:#c9a94a; border:none; color:#111622; font-weight:bold; cursor:pointer; }
</style>
</head>

<body>
<header>Transfers</header>

<div class="container">
    <div class="card">
        <h2>Send Money</h2>

        <label>From Account</label>
        <select>
            <option>Ultimate Checking — $30,000</option>
        </select>

        <label>To Account</label>
        <select>
            <option>NFCU Savings</option>
        </select>

        <label>Amount</label>
        <input type="number" placeholder="Enter amount">

        <button>Submit Transfer</button>
    </div>
</div>

</body>
</html>
