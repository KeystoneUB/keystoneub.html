<<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transfer – KeystoneUB</title>
<style>
body {
    background: #0a0f14;
    font-family: Arial, sans-serif;
    color: white;
}
.box {
    width: 90%;
    max-width: 500px;
    margin: 60px auto;
    padding: 25px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    border: 1px solid rgba(0,255,180,0.2);
}
input, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
}
button {
    width: 100%;
    padding: 14px;
    background: #00e6a8;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    color: black;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="box">
    <h2>Transfer Funds</h2>

    <label>From Account</label>
    <select>
        <option>Checking — $8,250.00</option>
        <option>Savings — $12,400.00</option>
    </select>

    <label>To Account</label>
    <input type="text" placeholder="Recipient Name or Account Number">

    <label>Amount</label>
    <input type="number" placeholder="$0.00">

    <button>Send Transfer</button>
</div>

</body>
</html>
