loading.html
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KeystoneUB • Loading</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--emerald:#00ff9c;--emerald-glow:0 0 25px #00ff9c,0 0 50px #00ff9c;
--text-gray:#cfcfcf;--text-soft:#9a9a9a;}
body{
  margin:0;background:radial-gradient(circle at top,#02110b 0,#020202 45%,#000 100%);
  font-family:"Inter",sans-serif;color:var(--text-gray);
  display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;
}
.logo-circle{
  width:70px;height:70px;border-radius:50%;border:2px solid var(--emerald);
  display:flex;align-items:center;justify-content:center;color:var(--emerald);
  font-size:28px;font-weight:700;box-shadow:var(--emerald-glow);margin-bottom:18px;
}
.spinner{
  width:40px;height:40px;border-radius:50%;
  border:3px solid rgba(255,255,255,0.1);
  border-top-color:var(--emerald);
  animation:spin 1s linear infinite;margin-bottom:10px;
}
@keyframes spin{to{transform:rotate(360deg);}}
p{font-size:13px;color:var(--text-soft);margin:4px 0;}
</style>
<script>
setTimeout(function(){
  window.location.href="dashboard.html";
},1500);
</script>
</head>
<body>
<div class="logo-circle">K</div>
<div class="spinner"></div>
<p>Loading your KeystoneUB dashboard, Madonna F. Bilyeu…</p>
<p>Please wait a moment.</p>
</body>
</html>
