profile.html
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KeystoneUB • Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
 --emerald:#00ff9c;--emerald-glow:0 0 25px #00ff9c,0 0 50px #00ff9c;
 --text-gray:#cfcfcf;--text-soft:#9a9a9a;--glass:rgba(255,255,255,0.06);
 --glass-border:rgba(255,255,255,0.12);
}
*{box-sizing:border-box;}
body{
 margin:0;background:radial-gradient(circle at top,#02110b 0,#020202 45%,#000 100%);
 font-family:"Inter",sans-serif;color:var(--text-gray);
}
.sidebar{
 width:260px;height:100vh;background:linear-gradient(180deg,rgba(0,255,156,0.12),rgba(0,0,0,0.9));
 border-right:1px solid var(--glass-border);backdrop-filter:blur(18px);
 position:fixed;top:0;left:0;padding:24px;box-shadow:var(--emerald-glow);
 display:flex;flex-direction:column;
}
.logo-circle{
 width:32px;height:32px;border-radius:50%;border:2px solid var(--emerald);
 display:flex;align-items:center;justify-content:center;color:var(--emerald);
 font-weight:700;font-size:16px;box-shadow:var(--emerald-glow);
}
.sidebar h2{font-size:20px;margin:0;color:var(--emerald);text-shadow:var(--emerald-glow);}
.sidebar-sub{font-size:11px;color:var(--text-soft);margin-top:2px;}
.sidebar-header{display:flex;align-items:center;gap:10px;margin-bottom:30px;}
.nav-item{
 padding:10px 10px;margin-bottom:6px;border-radius:10px;cursor:pointer;transition:.25s;
 font-size:14px;display:flex;align-items:center;gap:10px;color:var(--text-gray);
}
.nav-item span.icon{width:20px;text-align:center;font-size:15px;}
.nav-item.active,.nav-item:hover{background:rgba(0,255,156,0.12);box-shadow:var(--emerald-glow);color:var(--emerald);}
.sidebar-footer{margin-top:auto;font-size:11px;color:var(--text-soft);opacity:.8;}
.main{margin-left:260px;padding:32px 40px 40px;}
h1{margin:0 0 6px;font-size:22px;color:var(--emerald);text-shadow:var(--emerald-glow);}
p{margin:0 0 18px;font-size:13px;color:var(--text-soft);}
.card{
 background:var(--glass);border:1px solid var(--glass-border);border-radius:18px;
 padding:20px 20px 18px;margin-bottom:20px;backdrop-filter:blur(18px);box-shadow:var(--emerald-glow);
}
label{display:block;font-size:12px;color:var(--text-soft);margin-top:10px;margin-bottom:4px;}
input{
 width:100%;padding:10px;border-radius:10px;border:1px solid var(--glass-border);
 background:rgba(255,255,255,0.05);color:var(--text-gray);font-size:13px;outline:none;
}
input:focus{border-color:var(--emerald);box-shadow:var(--emerald-glow);}
button{
 margin-top:16px;padding:10px 18px;border-radius:10px;border:1px solid var(--emerald);
 background:var(--glass);color:var(--emerald);font-size:14px;cursor:pointer;transition:.25s;
}
button:hover{background:var(--emerald);color:#000;box-shadow:var(--emerald-glow);}
@media(max-width:900px){.sidebar{display:none;}.main{margin-left:0;padding:20px;}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo-circle">K</div>
    <div>
      <h2>KeystoneUB</h2>
      <div class="sidebar-sub">Digital Banking Suite</div>
    </div>
  </div>
  <div class="nav-item"><span class="icon">🏠</span><a href="dashboard.html" style="color:inherit;text-decoration:none;">Dashboard</a></div>
  <div class="nav-item"><span class="icon">🏦</span><a href="accounts.html" style="color:inherit;text-decoration:none;">Accounts</a></div>
  <div class="nav-item"><span class="icon">💳</span><a href="cards.html" style="color:inherit;text-decoration:none;">Cards</a></div>
  <div class="nav-item active"><span class="icon">👤</span>Profile</div>
  <div class="nav-item"><span class="icon">🔁</span><a href="transfers.html" style="color:inherit;text-decoration:none;">Transfers</a></div>
  <div class="nav-item"><span class="icon">🧾</span><a href="statements.html" style="color:inherit;text-decoration:none;">Statements</a></div>
  <div class="nav-item"><span class="icon">🚪</span><a href="logout.html" style="color:inherit;text-decoration:none;">Logout</a></div>
  <div class="sidebar-footer">KeystoneUB • Secure Session</div>
</div>

<div class="main">
  <h1>Profile • Madonna F. Bilyeu</h1>
  <p>Manage your KeystoneUB profile information and contact details.</p>

  <div class="card">
    <label>Full name</label>
    <input type="text" value="Madonna F. Bilyeu">

    <label>Email address</label>
    <input type="email" value="madonna.bilyeu@example.com">

    <label>Primary phone</label>
    <input type="text" value="+1 (555) 482-1024">

    <label>Mailing address</label>
    <input type="text" value="1024 Keystone Avenue, Manhattan, NY 10001">

    <button>Save changes</button>
  </div>
</div>
</body>
</html>
