<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile – KeystoneUB</title>
<link rel="stylesheet" href="assets/style.css">
<style>
body {
    background: #0a0f14;
    font-family: Arial, sans-serif;
    color: white;
}
.container {
    width: 90%;
    max-width: 600px;
    margin: 60px auto;
    padding: 25px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(0,255,180,0.2);
}
input, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
}
button {
    width: 100%;
    padding: 14px;
    background: #00e6a8;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    color: black;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="container">
    <h2>Profile Settings</h2>
    <label>Full Name</label>
    <input type="text" value="Madonna F. Bilyeu">

    <label>Email</label>
    <input type="email" value="madonna@keystoneub.com">

    <label>Phone</label>
    <input type="text" value="+1 (312) 555‑0192">

    <label>Address</label>
    <input type="text" value="Chicago, IL">

    <button>Save Changes</button>
</div>

</body>
</html>
