<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KeystoneUB – Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg-main: #050712;
            --bg-sidebar: #050814;
            --bg-card: #0b0f22;
            --border-subtle: #1d2238;
            --accent: #0b84ff;
            --accent-soft: rgba(11,132,255,0.12);
            --text-main: #ffffff;
            --text-muted: #9aa3c2;
            --success: #2ecc71;
            --danger: #ff4b6a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg-main);
            font-family: system-ui, sans-serif;
            color: var(--text-main);
        }

        /* Loading */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: #050712;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: var(--accent);
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            margin-top: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Layout */
        .app-shell { display: flex; min-height: 100vh; }
        .sidebar {
            width: 230px;
            background: var(--bg-sidebar);
            border-right: 1px solid rgba(255,255,255,0.06);
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 9px;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .nav-item.active {
            background: var(--accent-soft);
            color: var(--text-main);
            border: 1px solid rgba(11,132,255,0.5);
        }

        .nav-item:hover { background: rgba(255,255,255,0.05); }

        .main { flex: 1; display: flex; flex-direction: column; }

        .top-nav {
            padding: 14px 24px;
            background: #070a18;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0b84ff, #7b61ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }

        .page { padding: 24px; }
        .page-title { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
        .page-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 18px;
            border-radius: 14px;
        }

        .card-title { font-size: 14px; color: var(--text-muted); }
        .card-balance { font-size: 24px; font-weight: 600; }

        .transactions-list .tx-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 13px;
        }

        .tx-row:last-child { border-bottom: none; }
        .tx-name { font-weight: 500; }
        .tx-meta { font-size: 11px; color: var(--text-muted); }
        .tx-amount.positive { color: var(--success); }
        .tx-amount.negative { color: var(--danger); }

        .section { display: none; }
        .section.active { display: block; }
    </style>
</head>

<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading your KeystoneUB dashboard…</div>
</div>

<div class="app-shell" id="appShell" style="display:none;">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo-dot"></div> KeystoneUB
        </div>

        <div class="nav-item active" data-section="dashboard">🏠 Dashboard</div>
        <div class="nav-item" data-section="accounts">💼 Accounts</div>
        <div class="nav-item" data-section="creditcard">💳 Credit Card</div>
        <div class="nav-item" data-section="transactions">📜 Transactions</div>
        <div class="nav-item" data-section="transfers">🔁 Transfers</div>
        <div class="nav-item" data-section="profile">👤 Profile</div>
        <div class="nav-item" data-section="settings">⚙️ Settings</div>
    </aside>

    <!-- Main -->
    <div class="main">
        <header class="top-nav">
            <div>Welcome, Madonna F. Bilyeu</div>
            <div style="display:flex; align-items:center; gap:12px;">
