<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KeystoneUB — Transaction History</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b0d10;
        color: #fff;
    }

    .header {
        padding: 20px;
        background: #111622;
        border-bottom: 1px solid #2a2a2d;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .back-btn {
        background: #0d0f14;
        border: 1px solid #2a2a2d;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        color: #d4af37;
        font-weight: 600;
    }

    .title {
        font-size: 20px;
        font-weight: 700;
        color: #d4af37;
    }

    .filters {
        margin: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .filters input,
    .filters select {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #2a2a2d;
        background: #0d0f14;
        color: #fff;
        font-size: 14px;
    }

    .transactions {
        margin: 20px;
    }

    .transactions h3 {
        margin-bottom: 10px;
        color: #d4af37;
    }

    .transaction-item {
        background: #111622;
        border: 1px solid #2a2a2d;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
    }

    .transaction-item p {
        margin: 0;
    }

    .amount-pos {
        color: #4caf50;
        font-weight: 700;
    }

    .amount-neg {
        color: #e53935;
        font-weight: 700;
    }
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="back-btn" onclick="goBack()">← Back</div>
    <div class="title">Transaction History</div>
</div>

<!-- FILTERS -->
<div class="filters">
    <input type="text" placeholder="Search transactions…">

    <select>
        <option>All Categories</option>
        <option>Deposits</option>
        <option>Purchases</option>
        <option>Transfers</option>
        <option>ATM Withdrawals</option>
        <option>Payments</option>
    </select>

    <input type="date">
</div>

<!-- TRANSACTIONS -->
<div class="transactions">
    <h3>Recent Activity</h3>

    <div class="transaction-item">
        <p>Amazon Purchase — May 10</p>
        <span class="amount-neg">- $42.99</span>
    </div>

    <div class="transaction-item">
        <p>Incoming Wire — May 9</p>
        <span class="amount-pos">+ $1,200.00</span>
    </div>

    <div class="transaction-item">
        <p>ATM Withdrawal — May 8</p>
        <span class="amount-neg">- $60.00</span>
    </div>

    <div class="transaction-item">
        <p>Deposit — May 7</p>
        <span class="amount-pos">+ $300.00</span>
    </div>

    <div class="transaction-item">
        <p>Uber Ride — May 6</p>
        <span class="amount-neg">- $18.75</span>
    </div>
</div>

<script>
    function goBack() {
        window.location.href = "dashboard.html";
    }
</script>

</body>
</html>
