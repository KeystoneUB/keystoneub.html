<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KeystoneUB — Wire Transfers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b0d10;
        color: #fff;
    }

    .header {
        padding: 20px;
        background: #111622;
        border-bottom: 1px solid #2a2a2d;
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .back-btn {
        background: #0d0f14;
        border: 1px solid #2a2a2d;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        color: #d4af37;
        font-weight: 600;
    }

    .title {
        font-size: 20px;
        font-weight: 700;
        color: #d4af37;
    }

    .container {
        margin: 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .box {
        background: #111622;
        border: 1px solid #2a2a2d;
        padding: 20px;
        border-radius: 14px;
    }

    .box h3 {
        margin-top: 0;
        color: #d4af37;
        font-size: 18px;
    }

    .recipient-item {
        background: #0d0f14;
        border: 1px solid #2a2a2d;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 10px;
    }

    .input-group {
        margin-bottom: 15px;
    }

    .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #d4af37;
    }

    .input-group input,
    .input-group select {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #2a2a2d;
        background: #0d0f14;
        color: #fff;
        font-size: 14px;
    }

    .btn {
        width: 100%;
        padding: 12px;
        background: #d4af37;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        color: #0b0d10;
        cursor: pointer;
        margin-top: 10px;
    }

    .btn:hover {
        background: #b8962f;
    }

    .summary-line {
        display: flex;
        justify-content: space-between;
        margin: 8px 0;
        font-size: 14px;
    }
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="back-btn" onclick="goBack()">← Back</div>
    <div class="title">Wire Transfers</div>
</div>

<!-- MAIN CONTENT -->
<div class="container">

    <!-- SAVED RECIPIENTS -->
    <div class="box">
        <h3>Saved Recipients</h3>

        <div class="recipient-item">
            <strong>Gregory Carter</strong><br>
            Bank of America •••• 5521<br>
            <span style="color:#bfbfbf; font-size:13px;">Domestic Wire Recipient</span>
        </div>

        <div class="recipient-item">
            <strong>UN Authority</strong><br>
            Chase Bank •••• 8831<br>
            <span style="color:#bfbfbf; font-size:13px;">Domestic Wire Recipient</span>
        </div>

        <button class="btn" onclick="addRecipient()">Add New Recipient</button>
    </div>

    <!-- WIRE FORM -->
    <div class="box">
        <h3>Wire Transfer Details</h3>

        <div class="input-group">
            <label>From Account</label>
            <select id="fromAccount">
                <option>Keystone Checking •••• 1024 — $3,982.22</option>
                <option>Keystone Savings •••• 9281 — $4,820.55</option>
            </select>
        </div>

        <div class="input-group">
            <label>Select Recipient</label>
            <select id="recipient">
                <option>Gregory Carter — Bank of America</option>
                <option>UN Authority — Chase Bank</option>
            </select>
        </div>

        <div class="input-group">
            <label>Amount</label>
            <input type="number" id="amount" placeholder="Enter amount">
        </div>

        <div class="input-group">
            <label>Wire Purpose</label>
            <input type="text" id="purpose" placeholder="e.g., Invoice Payment">
        </div>

        <button class="btn" onclick="reviewWire()">Review Wire</button>
    </div>

    <!-- SUMMARY BOX -->
    <div class="box">
        <h3>Wire Summary</h3>

        <div class="summary-line">
            <span>From:</span>
            <span id="sumFrom">—</span>
        </div>

        <div class="summary-line">
            <span>Recipient:</span>
            <span id="sumRecipient">—</span>
        </div>

        <div class="summary-line">
            <span>Amount:</span>
            <span id="sumAmount">—</span>
        </div>

        <div class="summary-line">
            <span>Purpose:</span>
            <span id="sumPurpose">—</span>
        </div>

        <button class="btn" onclick="submitWire()">Submit Wire</button>
    </div>

</div>

<script>
    function goBack() {
        window.location.href = "dashboard.html";
    }

    function addRecipient() {
        alert("Recipient creation form coming soon.");
    }

    function reviewWire() {
        document.getElementById("sumFrom").innerText = document.getElementById("fromAccount").value;
        document.getElementById("sumRecipient").innerText = document.getElementById("recipient").value;
        document.getElementById("sumAmount").innerText = "$" + document.getElementById("amount").value;
        document.getElementById("sumPurpose").innerText = document.getElementById("purpose").value || "—";
    }

    function submitWire() {
        alert("Wire Transfer Submitted Successfully.");
        window.location.href = "transfer-confirmation.html";
    }
</script>

</body>
  </html>
