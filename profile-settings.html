<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeystoneUB Settings</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #071022;
            color: white;
        }

        .navbar {
            background: #0d162e;
            padding: 18px 30px;
            border-bottom: 1px solid #d4af37;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container {
            padding: 30px;
        }

        .title {
            font-size: 26px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 25px;
        }

        .section {
            background: #0d162e;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #d4af37;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        .section h3 {
            margin: 0 0 15px 0;
            color: #d4af37;
            font-size: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #d4af37;
        }

        .input-group select,
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #0b1326;
            color: white;
            font-size: 15px;
        }

        .btn {
            padding: 12px 20px;
            background: #d4af37;
            color: black;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            width: 100%;
        }

        .btn:hover {
            background: #b8922c;
        }

        .danger-btn {
            background: #ff4d4d;
            color: white;
        }

        .danger-btn:hover {
            background: #cc3c3c;
        }
    </style>
</head>

<body>

    <div class="navbar">Keystone Ultimate Bank</div>

    <div class="container">

        <div class="title">Settings</div>

        <!-- Appearance -->
        <div class="section">
            <h3>Appearance</h3>

            <div class="input-group">
                <label>Theme</label>
                <select>
                    <option>Dark Mode (Active)</option>
                    <option>Light Mode</option>
                </select>
            </div>

            <div class="input-group">
                <label>Font Size</label>
                <select>
                    <option>Medium (Default)</option>
                    <option>Small</option>
                    <option>Large</option>
                </select>
            </div>

            <button class="btn">Save Appearance</button>
        </div>

        <!-- Notifications -->
        <div class="section">
            <h3>Notifications</h3>

            <div class="input-group">
                <label>Email Notifications</label>
                <select>
                    <option>Enabled</option>
                    <option>Disabled</option>
                </select>
            </div>

            <div class="input-group">
                <label>SMS Alerts</label>
                <select>
                    <option>Enabled</option>
                    <option>Disabled</option>
                </select>
            </div>

            <button class="btn">Save Notifications</button>
        </div>

        <!-- Security -->
        <div class="section">
            <h3>Security</h3>

            <div class="input-group">
                <label>Change Password</label>
                <input type="password" placeholder="Enter new password">
            </div>

            <div class="input-group">
                <label>Two‑Factor Authentication</label>
                <select>
                    <option>Enabled</option>
                    <option>Disabled</option>
                </select>
            </div>

            <button class="btn">Update Security</button>
        </div>

        <!-- Account Management -->
        <div class="section">
            <h3>Account Management</h3>

            <button class="btn">Download My Data</button>
            <button class="danger-btn">Delete My Account</button>
        </div>

    </div>

</body>
</html>
<body>

<!-- HEADER -->
<div class="header">
    <div class="back-btn" onclick="goBack()">← Back</div>
    <div class="title">Profile Settings</div>
</div>

<!-- MAIN CONTENT -->
<div class="container">

    <!-- PROFILE PHOTO -->
    <div class="profile-photo">
        <img src="https://via.placeholder.com/110" alt="Profile Photo">
        <div class="edit-photo" onclick="changePhoto()">Change Photo</div>
    </div>

    <!-- NAME -->
    <div class="input-group">
        <label>Full Name</label>
        <input type="text" value="Charles">
    </div>

    <!-- EMAIL -->
    <div class="input-group">
        <label>Email Address</label>
        <input type="email" value="charles@example.com">
    </div>

    <!-- PHONE -->
    <div class="input-group">
        <label>Phone Number</label>
        <input type="text" value="(555) 123‑4567">
    </div>

    <!-- ADDRESS -->
    <div class="input-group">
        <label>Home Address</label>
        <input type="text" value="1234 Keystone Ave, Washington, DC">
    </div>

    <!-- SAVE BUTTON -->
    <button class="save-btn" onclick="saveChanges()">Save Changes</button>

</div>

<script>
    function goBack() {
        window.location.href = "dashboard.html";
    }

    function changePhoto() {
        alert("Photo upload feature coming soon.");
    }

    function saveChanges() {
        alert("Your profile has been updated.");
    }
</script>

</body>
</html>
