<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KeystoneUB — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b0d10;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #fff;
    }

    .login-container {
        background: #111622;
        border: 1px solid #2a2a2d;
        padding: 40px;
        width: 350px;
        border-radius: 14px;
        box-shadow: 0 0 25px rgba(0,0,0,0.4);
        animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .logo {
        text-align: center;
        margin-bottom: 25px;
        font-size: 26px;
        font-weight: 800;
        color: #d4af37;
    }

    .input-group {
        margin-bottom: 18px;
    }

    .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        color: #d4af37;
    }

    .input-group input {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #2a2a2d;
        background: #0d0f14;
        color: #fff;
        font-size: 14px;
    }

    .password-wrapper {
        position: relative;
    }

    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #d4af37;
        font-size: 14px;
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        background: #d4af37;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        color: #0b0d10;
        cursor: pointer;
        margin-top: 10px;
    }

    .login-btn:hover {
        background: #b8962f;
    }

    .forgot {
        text-align: center;
        margin-top: 15px;
        font-size: 13px;
        color: #bfbfbf;
        cursor: pointer;
    }

    .forgot:hover {
        color: #d4af37;
    }
</style>
</head>

<body>

<div class="login-container">
    <div class="logo">KeystoneUB</div>

    <div class="input-group">
        <label>Username</label>
        <input type="text" placeholder="Enter username">
    </div>

    <div class="input-group password-wrapper">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="Enter password">
        <span class="toggle-password" onclick="togglePassword()">Show</span>
    </div>

    <button class="login-btn" onclick="login()">Sign In</button>

    <div class="forgot">Forgot Password?</div>
</div>

<script>
    function togglePassword() {
        const input = document.getElementById("passwordInput");
        const toggle = document.querySelector(".toggle-password");

        if (input.type === "password") {
            input.type = "text";
            toggle.textContent = "Hide";
        } else {
            input.type = "password";
            toggle.textContent = "Show";
        }
    }

    function login() {
        window.location.href = "dashboard.html"; 
    }
</script>

</body>
</html>
