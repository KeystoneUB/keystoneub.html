<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keystone Ultimate Bank — Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0a0f1a; /* deep navy */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: #111622; /* charcoal */
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #c9a94a; /* brushed gold */
            width: 320px;
            text-align: center;
        }

        h1 {
            color: #c9a94a;
            margin-bottom: 25px;
            font-size: 22px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0a0f1a;
            border: 1px solid #c9a94a;
            border-radius: 6px;
            color: #ffffff;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #c9a94a;
            border: none;
            border-radius: 6px;
            color: #111622;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .link {
            margin-top: 15px;
            display: block;
            color: #c9a94a;
            text-decoration: none;
            font-size: 14px;
        }

        .error {
            color: #ff6b6b;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h1>KeystoneUB Login</h1>

    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Sign In</button>

    <div id="error" class="error">Invalid username or password</div>

    <a class="link" href="forgot.html">Forgot Password?</a>
</div>

<script>
    function login() {
        const user = document.getElementById("username").value.trim();
        const pass = document.getElementById("password").value.trim();
        const error = document.getElementById("error");

        if (user === "" || pass === "") {
            error.textContent = "Please enter both fields";
            error.style.display = "block";
            return;
        }

        // Demo login — accepts ANY username/password
        window.location.href = "dashboard.html";
    }
</script>

</body>
</html>
