<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeystoneUB Statements</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #071022;
            color: white;
        }

        .navbar {
            background: #0d162e;
            padding: 18px 30px;
            border-bottom: 1px solid #d4af37;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .container {
            padding: 30px;
        }

        .title {
            font-size: 26px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 25px;
        }

        .statement-card {
            background: #0d162e;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #d4af37;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .statement-info h3 {
            margin: 0;
            font-size: 20px;
            color: #d4af37;
        }

        .statement-info p {
            margin: 5px 0 0 0;
            font-size: 14px;
            opacity: 0.8;
        }

        .download-btn {
            padding: 12px 20px;
            background: #d4af37;
            color: black;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .download-btn:hover {
            background: #b8922c;
        }
    </style>
</head>

<body>

    <div class="navbar">Keystone Ultimate Bank</div>

    <div class="container">

        <div class="title">Statements</div>

        <div class="statement-card">
            <div class="statement-info">
                <h3>April 2026 Statement</h3>
                <p>Posted: May 1, 2026</p>
            </div>
            <button class="download-btn">Download PDF</button>
        </div>

        <div class="statement-card">
            <div class="statement-info">
                <h3>March 2026 Statement</h3>
                <p>Posted: April 1, 2026</p>
            </div>
            <button class="download-btn">Download PDF</button>
        </div>

        <div class="statement-card">
            <div class="statement-info">
                <h3>February 2026 Statement</h3>
                <p>Posted: March 1, 2026</p>
            </div>
            <button class="download-btn">Download PDF</button>
        </div>

        <div class="statement-card">
            <div class="statement-info">
                <h3>January 2026 Statement</h3>
                <p>Posted: February 1, 2026</p>
            </div>
            <button class="download-btn">Download PDF</button>
        </div>

    </div>

</body>
</html>
