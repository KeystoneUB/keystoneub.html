<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KeystoneUB — 2FA Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b0d10;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #fff;
    }

    .verify-container {
        background: #111622;
        border: 1px solid #2a2a2d;
        padding: 40px;
        width: 380px;
        border-radius: 14px;
        box-shadow: 0 0 25px rgba(0,0,0,0.4);
        animation: fadeIn 0.6s ease;
        text-align: center;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .logo {
        font-size: 26px;
        font-weight: 800;
        color: #d4af37;
        margin-bottom: 20px;
    }

    .subtitle {
        color: #bfbfbf;
        margin-bottom: 25px;
        font-size: 14px;
    }

    .code-inputs {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
    }

    .code-inputs input {
        width: 45px;
        height: 55px;
        text-align: center;
        font-size: 22px;
        border-radius: 8px;
        border: 1px solid #2a2a2d;
        background: #0d0f14;
        color: #fff;
    }

    .verify-btn {
        width: 100%;
        padding: 12px;
        background: #d4af37;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 700;
        color: #0b0d10;
        cursor: pointer;
        margin-top: 10px;
    }

    .verify-btn:hover {
        background: #b8962f;
    }

    .resend {
        margin-top: 15px;
        font-size: 13px;
        color: #bfbfbf;
        cursor: pointer;
    }

    .resend:hover {
        color: #d4af37;
    }
</style>
</head>

<body>

<div class="verify-container">
    <div class="logo">KeystoneUB</div>

    <div class="subtitle">
        Enter the 6‑digit verification code sent to your device.
    </div>

    <div class="code-inputs">
        <input type="text" maxlength="1" oninput="moveNext(this, 0)">
        <input type="text" maxlength="1" oninput="moveNext(this, 1)">
        <input type="text" maxlength="1" oninput="moveNext(this, 2)">
        <input type="text" maxlength="1" oninput="moveNext(this, 3)">
        <input type="text" maxlength="1" oninput="moveNext(this, 4)">
        <input type="text" maxlength="1" oninput="moveNext(this, 5)">
    </div>

    <button class="verify-btn" onclick="verifyCode()">Verify</button>

    <div class="resend" onclick="resendCode()">Resend Code</div>
</div>

<script>
    function moveNext(input, index) {
        const inputs = document.querySelectorAll('.code-inputs input');
        if (input.value && index < 5) {
            inputs[index + 1].focus();
        }
    }

    function verifyCode() {
        window.location.href = "dashboard.html";
    }

    function resendCode() {
        alert("A new verification code has been sent.");
    }
</script>

</body>
</html>
