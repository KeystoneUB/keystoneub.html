2fa.html
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KeystoneUB • Two‑Factor Authentication</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --emerald:#00ff9c;
  --emerald-glow:0 0 25px #00ff9c,0 0 50px #00ff9c;
  --text-gray:#cfcfcf;
  --text-soft:#9a9a9a;
  --glass:rgba(255,255,255,0.06);
  --glass-border:rgba(255,255,255,0.12);
}
body{
  margin:0;
  background:radial-gradient(circle at top,#02110b 0,#020202 45%,#000 100%);
  font-family:"Inter",sans-serif;
  color:var(--text-gray);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  width:360px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:18px;
  padding:26px;
  backdrop-filter:blur(18px);
  box-shadow:var(--emerald-glow);
  text-align:center;
}
.logo-circle{
  width:55px;
  height:55px;
  border-radius:50%;
  border:2px solid var(--emerald);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--emerald);
  font-size:24px;
  font-weight:700;
  margin:0 auto 14px;
  box-shadow:var(--emerald-glow);
}
h1{
  margin:0;
  font-size:20px;
  color:var(--emerald);
  text-shadow:var(--emerald-glow);
}
p{
  margin:6px 0 14px;
  font-size:13px;
  color:var(--text-soft);
}
.pin-row{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:10px 0 6px;
}
.pin-input{
  width:40px;
  height:40px;
  border-radius:10px;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.05);
  color:var(--text-gray);
  font-size:20px;
  text-align:center;
  outline:none;
}
.pin-input:focus{
  border-color:var(--emerald);
  box-shadow:var(--emerald-glow);
}
.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}
.key-btn{
  padding:10px 0;
  border-radius:10px;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.04);
  color:var(--text-gray);
  font-size:16px;
  cursor:pointer;
  transition:.2s;
}
.key-btn:hover{
  border-color:var(--emerald);
  color:var(--emerald);
  box-shadow:var(--emerald-glow);
}
button.confirm{
  width:100%;
  margin-top:14px;
  padding:11px;
  border-radius:10px;
  border:1px solid var(--emerald);
  background:var(--glass);
  color:var(--emerald);
  font-size:15px;
  cursor:pointer;
  transition:.25s;
}
button.confirm:hover{
  background:var(--emerald);
  color:#000;
  box-shadow:var(--emerald-glow);
}
.small{
  font-size:11px;
  color:var(--text-soft);
  margin-top:8px;
}
</style>
<script>
let currentIndex = 0;

function focusNext(){
  const inputs = document.querySelectorAll('.pin-input');
  if(currentIndex < inputs.length) inputs[currentIndex].focus();
}

function handleKeypad(num){
  const inputs = document.querySelectorAll('.pin-input');
  if(currentIndex >= inputs.length) return;
  inputs[currentIndex].value = num;
  currentIndex++;
  if(currentIndex < inputs.length){
    inputs[currentIndex].focus();
  }
}

function handleBackspace(){
  const inputs = document.querySelectorAll('.pin-input');
  if(currentIndex === 0 && inputs[0].value === "") return;
  if(currentIndex === inputs.length && inputs[currentIndex-1].value !== ""){
    inputs[currentIndex-1].value = "";
    currentIndex = inputs.length-1;
    inputs[currentIndex].focus();
    return;
  }
  if(currentIndex > 0){
    currentIndex--;
    inputs[currentIndex].value = "";
    inputs[currentIndex].focus();
  }
}

function submit2FA(){
  const inputs = document.querySelectorAll('.pin-input');
  const code = Array.from(inputs).map(i=>i.value).join("");
  if(code.length !== 6){
    alert("Please enter your 6‑digit code.");
    return;
  }
  // Simulated verification success
  window.location.href = "loading.html";
}

window.onload = focusNext;
</script>
</head>
<body>
<div class="card">
  <div class="logo-circle">K</div>
  <h1>Two‑Factor Authentication</h1>
  <p>Enter the 6‑digit code sent to your device, Madonna F. Bilyeu.</p>

  <div class="pin-row">
    <input maxlength="1" class="pin-input" type="password">
    <input maxlength="1" class="pin-input" type="password">
    <input maxlength="1" class="pin-input" type="password">
    <input maxlength="1" class="pin-input" type="password">
    <input maxlength="1" class="pin-input" type="password">
    <input maxlength="1" class="pin-input" type="password">
  </div>

  <div class="keypad">
    <div class="key-btn" onclick="handleKeypad('1')">1</div>
    <div class="key-btn" onclick="handleKeypad('2')">2</div>
    <div class="key-btn" onclick="handleKeypad('3')">3</div>
    <div class="key-btn" onclick="handleKeypad('4')">4</div>
    <div class="key-btn" onclick="handleKeypad('5')">5</div>
    <div class="key-btn" onclick="handleKeypad('6')">6</div>
    <div class="key-btn" onclick="handleKeypad('7')">7</div>
    <div class="key-btn" onclick="handleKeypad('8')">8</div>
    <div class="key-btn" onclick="handleKeypad('9')">9</div>
    <div class="key-btn" onclick="handleBackspace()">⌫</div>
    <div class="key-btn" onclick="handleKeypad('0')">0</div>
    <div class="key-btn" onclick="handleBackspace()">Clear</div>
  </div>

  <button class="confirm" onclick="submit2FA()">Verify & Continue</button>
  <div class="small">Having trouble? Try again or contact KeystoneUB support.</div>
</div>
</body>
</html>
